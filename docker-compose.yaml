name: key-keeper-app
services:
    postgres:
        container_name: postgres
        image: postgres
        ports:
            - 5432:5432
        restart: always
        environment:
            POSTGRES_DB: app
            POSTGRES_PASSWORD: postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    backend:
        build: backend
        container_name: backend
        ports:
            - "8080:8080"
        environment:
            - SPRING_PROFILES_ACTIVE=docker
        restart: always
        depends_on:
            -   postgres
    frontend:
        build: frontend
        container_name: frontend
        ports:
            - "4200:80"
        restart: always
        depends_on:
            -   backend
