<nz-table #basicTable [nzData]="data()" [nzLoading]="this.loadingService.$loading | async">
  <thead class="ant-table-thead">
  <tr>
    @for (column of columns(); track $index) {
      <th>{{ column.header }}</th>
    }
    <th></th>
  </tr>
  </thead>
  <tbody class="ant-table-tbody">
    @for (data of basicTable.data; track $index) {
      <tr>
        @for (column of columns(); track $index) {
          <td>{{ this.getRenderedValue(column, data) }}</td>
        }
        <td>
          @if (this.buttons()?.length) {
            @for (button of this.buttons(); track $index) {
              <button nz-button [nzType]="button.type!" (click)="button.click(data)">{{ button.label }}</button>
            }
          }
          <nz-divider nzType="vertical"/>
          <button nz-button nz-tooltip nzType="text" nzTooltipTitle="Megtekintés" (click)="handleView(data)">
            <nz-icon nzType="eye" />
          </button>
          <button nz-button nz-tooltip nzType="text" nzTooltipTitle="Törlés">
            <nz-icon nzType="delete"  />
          </button>
        </td>
      </tr>
    }
  </tbody>
</nz-table>
