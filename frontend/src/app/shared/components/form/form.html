<form nz-form [formGroup]="formGroup" (ngSubmit)="handleSubmit()" [class]="class()" nzLayout="vertical">
  @for (field of fields(); track $index) {
    <nz-form-item>
      @if (field.label) {
        <nz-form-label [nzRequired]="formGroup.get(field.name)?.hasValidator(Validators.required)">
          {{field.label}}
        </nz-form-label>
      }
      <nz-form-control [nzErrorTip]="errorTpl" [nzExtra]="field.extra">
        @if (field.type === "select") {
          <nz-select nzShowSearch nzAllowClear [nzPlaceHolder]="field.placeholder!">
            @for (option of field.options; track $index) {
              <nz-option [nzLabel]="option.label" [nzValue]="option.value"></nz-option>
            }
          </nz-select>
        } @else {
          <nz-input-group [nzPrefixIcon]="field.icon">
            <input [type]="field.type" nz-input [formControlName]="field.name" [placeholder]="field.placeholder ?? ''"/>
          </nz-input-group>
        }
        <ng-template let-control #errorTpl>
          @if (control.errors?.['required']) {
            {{ field.label || field.placeholder }} kitöltése kötelező!
          }
        </ng-template>
      </nz-form-control>
    </nz-form-item>
  }
  <ng-content select="[submit-button]"></ng-content>
</form>
