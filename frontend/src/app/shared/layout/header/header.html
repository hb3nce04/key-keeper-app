<nz-header>
  <ul nz-menu class="menu" nzTheme="dark" nzMode="horizontal">
    @for (link of NAV_LINKS; track $index) {
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" [routerLink]="link.path">{{ link.label }}</li>
    }
  </ul>
  <div class="control">
    <b>{{ this.authService.getUser() }}</b>
    <button nz-button nzType="link" (click)="handleLogout()">Kijelentkezés</button>
  </div>
  <div class="nav-toggle">
    <button
      nz-button
      nzType="primary"
      (click)="handleOpen()"
    >
      <nz-icon nzType="menu" nzTheme="outline"/>
    </button>
  </div>
</nz-header>
<nz-drawer
  [nzClosable]="true"
  [nzVisible]="isVisible()"
  (nzOnClose)="handleClose()"
>
  <ng-container *nzDrawerContent>
    <ul nz-menu>
      @for (link of NAV_LINKS; track $index) {
        <li nz-menu-item routerLinkActive="ant-menu-item-selected" [routerLink]="link.path">{{ link.label }}</li>
      }
    </ul>
    <nz-divider/>
    <button nz-button nzType="text">{{ this.authService.getUser() }}</button>
    <button nz-button nzType="link" (click)="handleLogout()">Kijelentkezés</button>
  </ng-container>
</nz-drawer>
